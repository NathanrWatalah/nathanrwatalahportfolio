<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Asset Manager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">IT Asset Manager<small id="who">Nathan R. Watalah</small></div>
    <nav class="links" aria-label="Related projects">
      <a id="lnkHelp" href="#" target="_blank" rel="noopener">Helpdesk</a>
      <a id="lnkKb" href="#" target="_blank" rel="noopener">Knowledge base</a>
      <button class="btn primary adm" id="addBtn" type="button">Add asset</button>
      <button class="btn" id="outBtn" type="button" hidden>Log out</button>
    </nav>
  </header>

  <section class="stats" id="stats" aria-label="Summary"></section>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-view="assets">Assets</button>
    <button role="tab" aria-selected="false" data-view="lic">Licences</button>
    <button role="tab" aria-selected="false" data-view="rep">Reports</button>
    <button role="tab" aria-selected="false" data-view="log">Activity</button>
  </div>

  <section id="v-assets">
    <div class="bar">
      <input type="search" id="q" placeholder="Search tag, name, serial, person, location" aria-label="Search">
      <select id="fStatus" aria-label="Filter by status"></select>
      <select id="fCat" aria-label="Filter by category"></select>
      <button class="btn" id="lblBtn" type="button">QR labels</button>
      <button class="btn" id="csvBtn" type="button">Export CSV</button>
      <button class="btn adm" id="impBtn" type="button">Import CSV</button>
      <input type="file" id="impFile" accept=".csv,text/csv" hidden>
    </div>
    <div class="tablebox"><table>
      <thead><tr>
        <th><button data-sort="id">Tag</button></th><th><button data-sort="name">Asset</button></th>
        <th><button data-sort="assignee">Assigned to</button></th><th><button data-sort="status">Status</button></th>
        <th><button data-sort="warranty">Warranty / service</button></th><th>Actions</th>
      </tr></thead><tbody id="rows"></tbody>
    </table><div class="empty" id="empty" hidden></div></div>
  </section>

  <section id="v-lic" hidden>
    <div class="bar"><button class="btn primary adm" id="addLic" type="button">Add licence</button></div>
    <div class="tablebox"><table>
      <thead><tr><th>ID</th><th>Software</th><th>Seats used</th><th>Expires</th><th>Cost</th><th>Actions</th></tr></thead>
      <tbody id="licRows"></tbody>
    </table><div class="empty" id="licEmpty" hidden>No licences yet. Add one to track seats and renewals.</div></div>
  </section>

  <section id="v-rep" hidden>
    <div class="bar noprint"><button class="btn primary" id="prtRep" type="button">Print report</button></div>
    <div class="report" id="report"></div>
  </section>

  <section id="v-log" hidden><ul class="log" id="logList"></ul></section>

  <footer><span id="count"></span><span id="mode"></span><button class="adm" id="sampleBtn" type="button">Load sample data</button></footer>
</div>

<dialog id="dlg"><form id="form" method="dialog">
  <h2 id="dTitle"></h2><div class="grid2" id="fields"></div>
  <ul class="hist" id="hist" hidden></ul><p class="err" id="err" hidden></p>
  <div class="dact"><button class="btn" type="button" id="cancel">Cancel</button><button class="btn primary adm" type="submit">Save</button></div>
</form></dialog>

<dialog id="lbl"><div class="dpad"><h2>QR labels</h2>
  <p style="margin:0 0 12px;color:var(--muted)">Print and stick one on each device. Scanning opens its record.</p>
  <div id="lblGrid"></div>
  <div class="dact"><button class="btn" type="button" id="lblClose">Close</button><button class="btn" type="button" id="lblSave">Download labels</button><button class="btn primary" type="button" id="lblPrint">Print</button></div>
</div></dialog>

<dialog id="login"><form id="loginForm" method="dialog">
  <h2>Sign in</h2>
  <label class="f">Password<input type="password" id="pw" autocomplete="current-password" required></label>
  <p class="err" id="loginErr" hidden></p>
  <div class="dact"><button class="btn primary" type="submit">Sign in</button></div>
</form></dialog>

<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
