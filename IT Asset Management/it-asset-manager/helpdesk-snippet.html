<!-- Paste into your helpdesk page (an HTML block or your theme footer scripts).
     1. Add a text field called "Asset tag" to the ticket form.
     2. This fills it from the link sent by the asset manager (?asset=AST-0001). -->
<script>
(function () {
  var tag = new URLSearchParams(location.search).get("asset");
  if (!tag || !/^AST-\d+$/.test(tag)) return;
  var field = document.querySelector('input[name*="asset" i], input[id*="asset" i]');
  if (field) { field.value = tag; field.readOnly = true; }
})();
</script>
